        - uid: 25b73f03-a350-4dd1-bb36-82c2bd2ca936
          title: SRE - High HTTP 5xx
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cg4w9zxjt845ce
              model:
                columns:
                    - selector: timestamp
                      text: Time
                      type: timestamp
                    - selector: http_5xx_percent
                      text: HTTP 5xx
                      type: number
                filters: []
                format: timeseries
                intervalMs: 1000
                maxDataPoints: 43200
                parser: backend
                refId: A
                root_selector: ""
                source: url
                type: csv
                url: https://raw.githubusercontent.com/admin-aeromero/observability-training/refs/heads/development/sre-lab-metrics.csv
                url_options:
                    data: ""
                    method: GET
            - refId: B
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            description: 'El porcentaje de errores 5xx es {{ $values.B }}%. Dashboard: /d/onb4kvj'
            summary: HTTP 5xx > 5%
          labels:
            service: streambox
            severity: critical
          isPaused: false
          missing_series_evals_to_resolve: 2
